<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>盐港隔离区 · 搜打撤</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="game" aria-label="盐港隔离区">
      <canvas id="world" aria-label="第一人称游戏画面"></canvas>
      <div id="hud" hidden>
        <div class="mission">
          <span class="eyebrow" id="floor">地面</span>
          <strong id="spawn"></strong>
        </div>
        <div class="routes" id="routes"></div>
        <div class="compass"><span id="bearing">N</span><span id="heading"></span></div>
        <div id="tactical-map" hidden><canvas id="map-canvas" width="900" height="750" aria-label="地区分布和撤离地图"></canvas><p>M 收起地图 · 地下出口以 B1 标注</p></div>
        <div id="crosshair" aria-hidden="true"></div>
        <div id="hurt" aria-hidden="true"></div>
        <div class="interaction" role="status">
          <div id="notice" hidden></div>
          <div id="prompt" hidden></div>
          <progress id="extraction" max="5" value="0" hidden></progress>
        </div>
        <div class="vitals">
          <div class="stat"><span>生命</span><strong id="health">100</strong></div>
          <div class="health-track"><div id="health-bar"></div></div>
          <div id="pack"></div>
        </div>
        <div class="weapon">
          <span class="eyebrow" id="weapon"></span>
          <strong id="ammo"></strong>
          <span id="weapon-action"></span>
        </div>
        <div class="hud-hint"><kbd>1</kbd> 主武器 I <kbd>2</kbd> 主武器 II <kbd>3</kbd> 手枪 <kbd>4</kbd> 近战 <kbd>Tab</kbd> 背包 <kbd>M</kbd> 地图 <kbd>Esc</kbd> 暂停</div>
      </div>

      <section id="overlay" aria-labelledby="title">
        <div class="panel">
          <p id="stage" class="eyebrow">SALTLINE / QUARANTINE SECTOR</p>
          <h1 id="title">盐港隔离区</h1>
          <p id="summary">搜刮地面物资，或深入地下实验室取回研究样本。活着抵达撤离区，携带的战利品才会入库。</p>
          <div class="controls" id="controls">
            <span><kbd>WASD</kbd> 移动</span><span><kbd>Shift</kbd> 奔跑</span>
            <span><kbd>鼠标</kbd> 转向</span><span><kbd>左键</kbd> 攻击</span>
            <span><kbd>右键</kbd> 举枪</span><span><kbd>R</kbd> 换弹</span>
            <span><kbd>1 / 2</kbd> 主武器槽</span><span><kbd>3</kbd> 手枪 <kbd>4</kbd> 近战</span>
            <span><kbd>M</kbd> 地区地图</span><span><kbd>E</kbd> 搜刮 / 撤离</span>
            <span><kbd>Tab</kbd> 背包 · <kbd>R</kbd> 旋转物品</span>
          </div>
          <div class="warehouse"><span class="eyebrow">仓库 · <span id="credits">0</span> 券</span><div id="warehouse">空</div><div id="market-stock"></div></div>
          <p id="error" hidden role="alert"></p>
          <label class="quality-control">画面质量 <select id="quality"><option value="balanced">Balanced</option><option value="high">High</option><option value="low">Low</option></select></label>
          <div class="actions">
            <button id="primary" type="button" disabled>开始出击</button>
            <button id="abandon" type="button" hidden>放弃出击</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
