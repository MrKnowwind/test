<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>盐港隔离区 · 搜打撤</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <section id="launch-screen" aria-label="正在加载盐港隔离区">
      <div class="launch-panel">
        <div class="launch-beacon" aria-hidden="true"><i></i></div>
        <h1>盐港隔离区</h1>
        <div class="launch-track" role="progressbar" aria-label="启动进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
      </div>
    </section>
    <main inert id="game" aria-label="盐港隔离区">
      <output id="frame-meter" hidden aria-label="帧率"></output>
      <canvas id="world" aria-label="第一人称游戏画面"></canvas>
      <div id="hud" hidden>
        <div class="mission">
          <span class="eyebrow" id="floor">地面</span>
          <strong id="spawn"></strong>
        </div>
        <section id="hud-minimap" aria-label="小地图"><canvas id="minimap-canvas" width="216" height="216"></canvas><span id="minimap-floor"></span></section>
        <section id="raid-objectives" aria-label="任务" hidden><h2>任务</h2><div id="objective-list"></div></section>
        <div class="compass"><span id="bearing">N</span><span id="heading"></span></div>
        <div id="tactical-map" hidden><canvas id="map-canvas" width="900" height="750" aria-label="地区分布和撤离地图"></canvas></div>
        <div id="exfil-clock" role="status" hidden></div>
        <div id="crosshair" aria-hidden="true"></div>
        <div id="hurt" aria-hidden="true"></div>
        <div class="interaction" role="status">
          <div id="notice" hidden></div>
          <div id="prompt" hidden></div>

        </div>
        <div class="vitals">
          <div class="stat"><span>生命</span><strong id="health">100</strong></div>
          <div class="health-track"><div id="health-bar"></div></div>
        </div>
        <div class="weapon">
          <span class="eyebrow" id="weapon"></span>
          <span id="weapon-action"></span>
          <div id="ammo-popup" role="status" hidden><span id="ammo-type">9mm 弹药</span><strong id="ammo"></strong><small id="ammo-label">弹匣 / 备弹</small></div>
        </div>
      </div>

      <div id="pickup-receipt" role="status" hidden></div>
      <section id="overlay" data-mode="home" aria-labelledby="title">
        <div class="panel">
          <div class="outpost-top"><div><p id="stage" hidden></p><h1 id="title">盐港隔离区</h1></div><button type="button" id="settings-open">设置</button></div>
          <p id="summary" hidden></p>
          <div id="outpost">
            <nav class="outpost-nav" aria-label="整备与交易">
              <button type="button" data-outpost="prepare" aria-pressed="true">战前整备</button>
              <button type="button" data-outpost="buy" aria-pressed="false">商店</button>
              <button type="button" data-outpost="sell" aria-pressed="false">仓库</button>
              <span class="wallet"><b id="credits">0</b> 券</span>
            </nav>
            <section id="prepare-pane" class="outpost-pane" aria-label="战前整备"><div id="prepare-slots"></div><div id="prepare-grid"></div></section>
            <section id="buy-pane" class="outpost-pane" aria-label="商店" hidden><div id="buy-stock" class="trade-grid"></div></section>
            <section id="sell-pane" class="outpost-pane" aria-label="仓库" hidden><div class="market-heading"><span>回收报价</span><time id="market-refresh"></time></div><div id="market-stock" class="trade-grid"></div></section>
          </div>
          <section id="creative-panel" aria-label="开发者创造模式" hidden>
            <button type="button" id="creative-toggle" aria-pressed="false" aria-controls="creative-options">开启开发者创造模式</button>
            <div id="creative-options" hidden>
              <label><input id="creative-flight" type="checkbox" checked> 飞行</label>
              <label>移速 <input id="creative-speed" type="range" min="0.5" max="5" step="0.5" value="1"><output id="speed-value">1×</output></label>
              <div class="creative-stock"><label>物品 <select id="creative-item"></select></label><label>数量 <input id="creative-qty" type="number" value="1" min="1" max="60"></label></div>
              <div><button type="button" id="creative-give">放入背包</button> <button type="button" id="creative-drop">生成在脚边</button></div>
              <output id="creative-feedback" role="status"></output>
            </div>
          </section>
          <p id="error" hidden role="alert"></p>
          <div class="actions">
            <button id="primary" type="button" disabled>出击</button>
            <button id="abandon" type="button" hidden>放弃出击</button>
          </div>
        </div>
        <aside class="operator-card" aria-label="盐港出击队员"><canvas class="operator-portrait"></canvas></aside>
      </section>
      <dialog id="settings-dialog" aria-labelledby="settings-title">
        <header><h2 id="settings-title">设置</h2><button type="button" id="settings-close" autofocus aria-label="关闭设置">×</button></header>
        <section id="setting-options" aria-label="游戏设置"></section>
        <h3>键位</h3><div id="bindings"></div>
        <footer><output id="binding-status" role="status"></output><button type="button" id="settings-reset">恢复默认</button></footer>
      </dialog>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
